<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>annotated-doc - Workbench floor</title>
  <style>
    :root { color-scheme:light dark; --bg:#f6f7f9; --panel:#fff; --line:#d8dce3; --muted:#667085; --accent:#1d4ed8; --danger:#b91c1c; --ok:#15803d; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:#111; background:var(--bg); font:14px/1.45 system-ui,sans-serif; }
    header { display:flex; gap:12px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
    header h1 { margin:0; font-size:15px; font-weight:650; }
    header .meta { margin-left:auto; color:var(--muted); font-size:12px; }
    main { display:grid; grid-template-columns:240px 1fr; height:calc(100vh - 45px); }
    aside { overflow:auto; padding:12px; border-right:1px solid var(--line); background:var(--panel); }
    button { padding:7px 10px; border:1px solid var(--line); border-radius:7px; background:var(--panel); cursor:pointer; }
    button:disabled { opacity:.5; cursor:default; }
    #create { width:100%; margin-bottom:12px; color:#fff; border-color:var(--accent); background:var(--accent); }
    .doc { margin-bottom:4px; padding:8px 10px; border:1px solid transparent; border-radius:8px; cursor:pointer; }
    .doc:hover { background:#eef2ff; }
    .doc.active { border-color:#c7d2fe; background:#e0e7ff; }
    .doc small { display:block; margin-top:2px; color:var(--muted); font-size:11px; }
    #editor-wrap { display:flex; flex-direction:column; min-width:0; }
    #status { min-height:34px; padding:8px 16px; border-bottom:1px solid var(--line); color:var(--muted); background:var(--panel); font-size:12px; }
    #status.error { color:var(--danger); }
    #status.ok { color:var(--ok); }
    #marker-bar { display:flex; gap:8px; align-items:center; padding:6px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
    #add-comment:disabled { opacity:.5; cursor:default; }
    #editor { flex:1; overflow:auto; min-height:200px; margin:16px; padding:16px 18px; border:1px solid var(--line); border-radius:10px; outline:none; background:var(--panel); white-space:pre-wrap; font:15px/1.55 ui-sans-serif,system-ui,sans-serif; }
    #editor [data-annotation-families~="comment"] { background:#fef08a; }
    #editor:empty::before { color:#98a2b3; content:attr(data-placeholder); }
    #empty { margin:40px auto; color:var(--muted); text-align:center; }
    .hidden { display:none !important; }
    @media (max-width:700px) { main { grid-template-columns:1fr; grid-template-rows:auto 1fr; } aside { display:flex; gap:8px; overflow:auto; border-right:0; border-bottom:1px solid var(--line); } #create { width:auto; margin:0; } #list { display:flex; gap:4px; } .doc { min-width:140px; } }
  </style>
</head>
<body>
  <header>
    <h1>annotated-doc</h1>
    <span class="meta">Workbench <code>annotatedText()</code> floor - fixed principal <code>demo</code></span>
  </header>
  <main>
    <aside>
      <button id="create">New document</button>
      <div id="list"></div>
    </aside>
    <section id="editor-wrap">
      <div id="status">Select or create a document.</div>
      <div id="marker-bar">
        <button id="add-comment" disabled>Add comment marker</button>
      </div>
      <div id="empty">No document open.</div>
      <div id="editor" class="hidden" spellcheck="true" data-placeholder="Type here" role="textbox" aria-multiline="true"></div>
    </section>
  </main>
  <script type="module">
    import { bindAnnotatedTextEditor, createAnnotatedTextHttpSession } from '/workbench.mjs';
    import { DocClient } from '/client-handle.mjs';

    const $ = (id) => document.getElementById(id);
    const historySession = (() => {
      const key = 'annotated-doc-history-session';
      const existing = sessionStorage.getItem(key);
      if (existing) return existing;
      const value = crypto.randomUUID().replaceAll('-', '');
      sessionStorage.setItem(key, value);
      return value;
    })();
    let docs = [];
    let currentId = null;
    let session = null;
    let editorBinding = null;
    let unsubscribe = null;
    let busy = false;

    function setStatus(message, kind = '') {
      $('status').textContent = message;
      $('status').className = kind;
    }

    function reportError(error) {
      const message = error?.message ?? String(error);
      console.error(`[annotated-doc] ${message}`);
      setStatus(message, 'error');
    }

    function shortId(id) { return id.length > 12 ? `${id.slice(0, 8)}...` : id; }

    function renderDocList() {
      $('list').replaceChildren();
      if (!docs.length) {
        const empty = document.createElement('p');
        empty.textContent = 'no documents yet';
        empty.style.cssText = 'color:#98a2b3;margin:8px 4px';
        $('list').append(empty);
        return;
      }
      for (const doc of docs) {
        const item = document.createElement('div');
        item.className = `doc${doc.id === currentId ? ' active' : ''}`;
        const label = document.createElement('strong');
        label.textContent = shortId(doc.id);
        const detail = document.createElement('small');
        detail.textContent = doc.id;
        item.append(label, detail);
        item.onclick = () => void openWhenFree(doc.id);
        $('list').append(item);
      }
    }

    async function loadDocs() {
      const response = await fetch('/docs', { credentials: 'include' });
      if (!response.ok) throw new Error(`list failed (${response.status})`);
      docs = (await response.json()).docs ?? [];
      renderDocList();
    }

    function closeSession() {
      unsubscribe?.();
      editorBinding?.close();
      session?.close();
      unsubscribe = null;
      editorBinding = null;
      session = null;
    }

    function renderSessionStatus(document = session?.document) {
      const block = document?.blocks?.find((candidate) => candidate.kind === 'visible');
      setStatus(
        document ? `${session.status} - ${block ? `${block.id.slice(0, 8)}...` : 'no visible block'}` : 'document unavailable',
        document && session.status === 'live' ? 'ok' : document ? '' : 'error',
      );
    }

    function withTimeout(promise, ms, message) {
      let timer;
      return Promise.race([
        promise,
        new Promise((_, reject) => { timer = setTimeout(() => reject(new Error(message)), ms); }),
      ]).finally(() => clearTimeout(timer));
    }

    function openWhenFree(id) {
      return (async () => {
        while (busy) await new Promise((resolve) => setTimeout(resolve, 50));
        await openDoc(id);
      })();
    }

    async function openDoc(id) {
      if (busy) return;
      busy = true;
      closeSession();
      currentId = id;
      renderDocList();
      $('empty').classList.add('hidden');
      $('editor').classList.remove('hidden');
      setStatus(`opening ${shortId(id)}...`);
      try {
        session = createAnnotatedTextHttpSession({
          baseUrl: '/live-delivery',
          context: { entity: DocClient, field: DocClient.body, documentId: id },
          historySession,
          onRecoveryDelayed: (delayed) => {
            if (delayed) setStatus('sync delayed - still retrying...');
          },
        });
        unsubscribe = session.subscribe(renderSessionStatus);
        editorBinding = bindAnnotatedTextEditor({
          element: $('editor'),
          session,
          onError: reportError,
        });
        await withTimeout(session.ready, 10000, 'document is taking too long to open — try again');
        renderSessionStatus();
        updateCommentButton();
        editorBinding.focus();
      } catch (error) {
        reportError(error);
        closeSession();
      } finally {
        busy = false;
      }
    }

    async function createDoc() {
      $('create').disabled = true;
      try {
        const response = await fetch('/docs', {
          method: 'POST', credentials: 'include', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ clientId: historySession }),
        });
        const body = await response.json();
        if (!response.ok || !body.ok) throw new Error(body.failure?.message ?? `create failed (${response.status})`);
        await loadDocs();
        await openWhenFree(body.id);
      } catch (error) {
        reportError(error);
      } finally {
        $('create').disabled = false;
      }
    }

    $('create').onclick = () => void createDoc();

    function addCommentMarker() {
      if ($('editor').getAttribute('aria-busy') === 'true') {
        setStatus('wait for the local text change to finish before adding a marker', 'error');
        return;
      }
      const selection = editorBinding?.getSelection();
      if (!selection) {
        setStatus('select text in the document first', 'error');
        return;
      }
      if (selection.from.blockId === selection.to.blockId && selection.from.offset === selection.to.offset) {
        setStatus('select a range of text to comment on', 'error');
        return;
      }
      const annotation = {
        id: crypto.randomUUID(),
        family: 'comment',
        fields: {},
      };
      Promise.resolve().then(() => session.applyAnnotation({
        mutationId: crypto.randomUUID(),
        annotation,
        from: selection.from,
        to: selection.to,
      })).then(async (result) => {
        if (result?.ok === false) throw (result.failure ?? new Error('comment marker was not applied'));
        if (result?.settlement?.wait) {
          const settlement = await result.settlement.wait();
          if (settlement?.status !== 'reconciled') throw new Error('comment marker was not reconciled');
        }
        setStatus('comment marker added', 'ok');
      }).catch((error) => {
        reportError(error);
      });
    }

    $('add-comment').onclick = () => void addCommentMarker();
    function updateCommentButton() {
      const selection = editorBinding?.getSelection();
      const enabled = selection !== null
        && (selection.from.blockId !== selection.to.blockId || selection.from.offset !== selection.to.offset);
      $('add-comment').disabled = session?.status !== 'live' || !enabled;
    }
    document.addEventListener('selectionchange', updateCommentButton);
    try {
      await loadDocs();
      if (docs[0]) await openDoc(docs[0].id);
    } catch (error) {
      reportError(error);
    }
  </script>
</body>
</html>
