<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>annotated-doc - Workbench floor</title>
  <style>
    :root { color-scheme:light dark; --bg:#f6f7f9; --panel:#fff; --line:#d8dce3; --muted:#667085; --accent:#1d4ed8; --danger:#b91c1c; --ok:#15803d; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:#111; background:var(--bg); font:14px/1.45 system-ui,sans-serif; }
    header { display:flex; gap:12px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
    header h1 { margin:0; font-size:15px; font-weight:650; }
    header .meta { margin-left:auto; color:var(--muted); font-size:12px; }
    main { display:grid; grid-template-columns:240px 1fr; height:calc(100vh - 45px); }
    aside { overflow:auto; padding:12px; border-right:1px solid var(--line); background:var(--panel); }
    button { padding:7px 10px; border:1px solid var(--line); border-radius:7px; background:var(--panel); cursor:pointer; }
    button:disabled { opacity:.5; cursor:default; }
    #create { width:100%; margin-bottom:12px; color:#fff; border-color:var(--accent); background:var(--accent); }
    .doc { display:flex; align-items:center; gap:8px; margin-bottom:4px; padding:8px 10px; border:1px solid transparent; border-radius:8px; cursor:pointer; }
    .doc:hover { background:#eef2ff; }
    .doc.active { border-color:#c7d2fe; background:#e0e7ff; }
    .doc .doc-label { flex:1; min-width:0; }
    .doc small { display:block; margin-top:2px; color:var(--muted); font-size:11px; }
    .doc .delete-doc { flex:none; padding:3px 7px; color:var(--danger); font-size:11px; line-height:1.3; }
    .doc .delete-doc:hover { border-color:var(--danger); }
    #editor-wrap { display:flex; flex-direction:column; min-width:0; }
    #status { min-height:34px; padding:8px 16px; border-bottom:1px solid var(--line); color:var(--muted); background:var(--panel); font-size:12px; }
    #status.error { color:var(--danger); }
    #status.ok { color:var(--ok); }
    #marker-bar { display:flex; gap:8px; align-items:center; padding:6px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
    #marker-bar label { display:flex; gap:6px; align-items:center; color:var(--muted); font-size:12px; }
    #comment-color { width:112px; padding:5px 7px; border:1px solid var(--line); border-radius:7px; background:var(--panel); color:inherit; }
    #add-comment:disabled { opacity:.5; cursor:default; }
    #document-workspace { display:grid; grid-template-columns:minmax(0,1fr) 260px; flex:1; min-height:0; }
    #editor-column { display:flex; flex-direction:column; min-width:0; overflow:auto; }
    #editor { flex:1; overflow:auto; min-height:200px; margin:16px 16px 8px; padding:16px 18px; border:1px solid var(--line); border-radius:10px; outline:none; background:var(--panel); white-space:pre-wrap; font:15px/1.55 ui-sans-serif,system-ui,sans-serif; }
    #editor [data-annotation-families~="comment"] { background:var(--annotation-color, #fef08a); }
    #editor [data-annotation-families~="sensitive"] { background:#111; color:#fff; border-radius:3px; padding:0 2px; box-shadow:inset 0 0 0 1px #000; }
    #editor [data-restricted="true"] { background:#111; color:#fff; border-radius:3px; padding:0 2px; box-shadow:inset 0 0 0 1px #000; }
    #editor [data-active-annotation="true"] { background:#f59e0b !important; box-shadow:inset 0 -2px #b45309; }
    #editor:empty::before { color:#98a2b3; content:attr(data-placeholder); }
    #annotations-panel { overflow:auto; margin:16px 16px 16px 0; padding-left:16px; border-left:1px solid var(--line); }
    #annotations-panel h2 { margin:0 0 10px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
    #annotations-empty { margin:0; color:var(--muted); font-size:12px; }
    .annotation-card { margin-bottom:8px; padding:10px; border:1px solid var(--line); border-radius:9px; background:var(--panel); }
    .annotation-card:hover, .annotation-card:focus-within { border-color:#f59e0b; }
    .annotation-card strong { display:block; margin-bottom:3px; }
    .annotation-color { display:inline-block; width:10px; height:10px; margin-right:6px; border:1px solid color-mix(in srgb, #000 20%, transparent); border-radius:999px; vertical-align:-1px; }
    .annotation-card p { overflow:hidden; margin:0 0 8px; color:var(--muted); font-size:12px; text-overflow:ellipsis; white-space:nowrap; }
    .annotation-card button { padding:4px 7px; color:var(--danger); font-size:12px; }
    #live-state { margin:0 16px 16px; border:1px solid var(--line); border-radius:9px; background:var(--panel); }
    #live-state summary { padding:8px 10px; cursor:pointer; color:var(--muted); font-size:12px; }
    #live-state pre { max-height:240px; overflow:auto; margin:0; padding:10px; border-top:1px solid var(--line); background:#f8fafc; color:#334155; font:11px/1.45 ui-monospace,SFMono-Regular,monospace; }
    #empty { margin:40px auto; color:var(--muted); text-align:center; }
    .hidden { display:none !important; }
    @media (max-width:700px) { main { grid-template-columns:1fr; grid-template-rows:auto 1fr; } aside { display:flex; gap:8px; overflow:auto; border-right:0; border-bottom:1px solid var(--line); } #create { width:auto; margin:0; } #list { display:flex; gap:4px; } .doc { min-width:140px; } #document-workspace { grid-template-columns:1fr; grid-template-rows:minmax(240px,1fr) auto; overflow:auto; } #editor { min-height:240px; } #annotations-panel { overflow:visible; margin:0 16px 16px; padding:14px 0 0; border-top:1px solid var(--line); border-left:0; } }
  </style>
</head>
<body>
  <header>
    <h1>annotated-doc</h1>
    <span class="meta">Workbench <code>annotatedText()</code> floor - fixed principal <code>demo</code></span>
  </header>
  <main>
    <aside>
      <button id="create">New document</button>
      <div id="list"></div>
    </aside>
    <section id="editor-wrap">
      <div id="status">Select or create a document.</div>
      <div id="marker-bar">
        <label for="comment-color">Color
          <select id="comment-color" aria-label="Comment color">
            <option value="#fef08a">Yellow</option>
            <option value="#fecaca">Red</option>
            <option value="#bfdbfe">Blue</option>
            <option value="#bbf7d0">Green</option>
            <option value="#e9d5ff">Purple</option>
          </select>
        </label>
        <button id="add-comment" disabled>Add comment marker</button>
        <button id="mark-confidential" disabled>Mark confidential</button>
        <label for="view-as">View as
          <select id="view-as" aria-label="View as">
            <option value="demo">Owner (demo)</option>
            <option value="reader">Reader</option>
          </select>
        </label>
      </div>
      <div id="empty">No document open.</div>
      <div id="document-workspace" class="hidden">
         <div id="editor-column">
           <div id="editor" spellcheck="true" data-placeholder="Type here" role="textbox" aria-multiline="true"></div>
           <details id="live-state">
             <summary>Live JSON state</summary>
             <pre aria-label="Live JSON state"></pre>
           </details>
         </div>
        <section id="annotations-panel" aria-label="Comments">
          <h2>Comments</h2>
          <p id="annotations-empty">No comments yet.</p>
          <div id="annotations"></div>
        </section>
      </div>
    </section>
  </main>
  <script type="module">
    import { bindAnnotatedTextEditor, createAnnotatedTextHttpSession } from '/workbench.mjs';
    import { DocClient } from '/client-handle.mjs';
    import { awaitSettlement, createCommentPanel } from '/comment-panel.mjs';

    const $ = (id) => document.getElementById(id);
    const historySession = (() => {
      const key = 'annotated-doc-history-session';
      const existing = sessionStorage.getItem(key);
      if (existing) return existing;
      const value = crypto.randomUUID().replaceAll('-', '');
      sessionStorage.setItem(key, value);
      return value;
    })();
    let docs = [];
    let currentId = null;
    let session = null;
    let editorBinding = null;
    let unsubscribe = null;
    let openChain = Promise.resolve();
    // Per-tab view: stored in sessionStorage (per-tab, not shared across tabs),
    // and carried in every session request's identity. Two tabs in one browser
    // can be owner and reader independently.
    const viewAs = sessionStorage.getItem('annotated-doc-view-as') === 'reader' ? 'reader' : 'demo';

    function enqueueOpen(id) {
      const run = openChain.then(() => openDoc(id));
      openChain = run.catch(() => {});
      return run;
    }

    const panel = createCommentPanel({
      editorEl: $('editor'),
      annotationsEl: $('annotations'),
      emptyEl: $('annotations-empty'),
      getEditorBinding: () => editorBinding,
    });

    function setStatus(message, kind = '') {
      $('status').textContent = message;
      $('status').className = kind;
    }

    function reportError(error) {
      const message = error?.message ?? String(error);
      console.error(`[annotated-doc] ${message}`);
      // After a server restart the browser's authoring stream/lease may be
      // stale; a reload rebinds it. Surface a clear recovery hint instead of a
      // bare server error.
      if (/authoring stream unavailable|authoring lease unavailable/.test(message)) {
        setStatus(`${message} — reload the page to rebind the session`, 'error');
        return;
      }
      setStatus(message, 'error');
    }

    function shortId(id) { return id.length > 12 ? `${id.slice(0, 8)}...` : id; }

    function renderDocList() {
      $('list').replaceChildren();
      if (!docs.length) {
        const empty = document.createElement('p');
        empty.textContent = 'no documents yet';
        empty.style.cssText = 'color:#98a2b3;margin:8px 4px';
        $('list').append(empty);
        return;
      }
      for (const doc of docs) {
        const item = document.createElement('div');
        item.className = `doc${doc.id === currentId ? ' active' : ''}`;
        const label = document.createElement('div');
        label.className = 'doc-label';
        const title = document.createElement('strong');
        title.textContent = shortId(doc.id);
        const detail = document.createElement('small');
        detail.textContent = doc.id;
        label.append(title, detail);
        item.append(label);
        if (viewAs === 'demo') {
          const remove = document.createElement('button');
          remove.className = 'delete-doc';
          remove.textContent = 'Delete';
          remove.title = 'Delete document';
          remove.onclick = (event) => {
            event.stopPropagation();
            void deleteDoc(doc.id);
          };
          item.append(remove);
        }
        item.onclick = () => void enqueueOpen(doc.id);
        $('list').append(item);
      }
    }

    const deleting = new Set();

    async function deleteDoc(id) {
      if (deleting.has(id)) return;
      if (!window.confirm('Delete this document? This cannot be undone.')) return;
      deleting.add(id);
      const wasCurrent = id === currentId;
      if (wasCurrent) {
        closeSession();
        currentId = null;
        $('empty').classList.remove('hidden');
        $('document-workspace').classList.add('hidden');
        setStatus('deleting...');
      }
      try {
        const response = await fetch(
          `/docs/${encodeURIComponent(id)}${viewAs === 'reader' ? '?viewAs=reader' : ''}`,
          { method: 'DELETE', credentials: 'include' },
        );
        const body = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(body.failure?.message ?? body.error ?? `delete failed (${response.status})`);
        await loadDocs();
        if (wasCurrent) setStatus('document deleted', 'ok');
      } catch (error) {
        reportError(error);
        if (wasCurrent) await enqueueOpen(id);
      } finally {
        deleting.delete(id);
      }
    }

    async function loadDocs() {
      const response = await fetch(`/docs${viewAs === 'reader' ? '?viewAs=reader' : ''}`, { credentials: 'include' });
      if (!response.ok) throw new Error(`list failed (${response.status})`);
      docs = (await response.json()).docs ?? [];
      renderDocList();
    }

    function closeSession() {
      unsubscribe?.();
      editorBinding?.close();
      session?.close();
      unsubscribe = null;
      editorBinding = null;
      session = null;
      panel.renderAnnotations(null);
      $('live-state').querySelector('pre').textContent = 'null';
    }

    function renderSessionStatus(document = session?.document) {
      const block = document?.blocks?.find((candidate) => candidate.kind === 'visible');
      setStatus(
        document ? `${session.status} - ${block ? `${block.id.slice(0, 8)}...` : 'no visible block'}` : 'document unavailable',
        document && session.status === 'live' ? 'ok' : document ? '' : 'error',
      );
    }

    function renderSession(document = session?.document) {
      renderSessionStatus(document);
      panel.renderAnnotations(document, { onRemove: removeAnnotation });
      panel.renderAnnotationColors(document);
      $('live-state').querySelector('pre').textContent = JSON.stringify(document ?? null, null, 2);
    }

    function withTimeout(promise, ms, message) {
      let timer;
      return Promise.race([
        promise,
        new Promise((_, reject) => { timer = setTimeout(() => reject(new Error(message)), ms); }),
      ]).finally(() => clearTimeout(timer));
    }

    async function openDoc(id) {
      closeSession();
      currentId = id;
      renderDocList();
      $('empty').classList.add('hidden');
      $('document-workspace').classList.remove('hidden');
      setStatus(`opening ${shortId(id)}...`);
      try {
        session = createAnnotatedTextHttpSession({
          baseUrl: '/live-delivery',
          context: { entity: DocClient, field: DocClient.body, documentId: id, viewAs },
          historySession,
          onRecoveryDelayed: (delayed) => {
            if (delayed) setStatus('sync delayed - still retrying...');
          },
        });
        editorBinding = bindAnnotatedTextEditor({
          element: $('editor'),
          session,
          onError: reportError,
        });
        unsubscribe = session.subscribe(renderSession);
        await withTimeout(session.ready, 10000, 'document is taking too long to open — try again');
        renderSession();
        updateCommentButton();
        editorBinding.focus();
      } catch (error) {
        reportError(error);
        closeSession();
      }
    }

    async function createDoc() {
      $('create').disabled = true;
      try {
        const response = await fetch('/docs', {
          method: 'POST', credentials: 'include', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ clientId: historySession }),
        });
        const body = await response.json();
        if (!response.ok || !body.ok) throw new Error(body.failure?.message ?? `create failed (${response.status})`);
        await loadDocs();
        await enqueueOpen(body.id);
      } catch (error) {
        reportError(error);
      } finally {
        $('create').disabled = false;
      }
    }

    $('create').onclick = () => void createDoc();

    function addCommentMarker() {
      if ($('editor').getAttribute('aria-busy') === 'true') {
        setStatus('wait for the local text change to finish before adding a marker', 'error');
        return;
      }
      const selection = editorBinding?.getSelection();
      if (!selection) {
        setStatus('select text in the document first', 'error');
        return;
      }
      if (selection.from.blockId === selection.to.blockId && selection.from.offset === selection.to.offset) {
        setStatus('select a range of text to comment on', 'error');
        return;
      }
      const annotation = {
        id: crypto.randomUUID(),
        family: 'comment',
        fields: { color: $('comment-color').value },
      };
      Promise.resolve().then(() => session.applyAnnotation({
        mutationId: crypto.randomUUID(),
        annotation,
        from: selection.from,
        to: selection.to,
      })).then(async (result) => {
        await awaitSettlement(result, {
          failMessage: 'comment marker was not applied',
          unreconciledMessage: 'comment marker was not reconciled',
        });
        panel.selectAnnotation(annotation.id);
        setStatus('comment marker added', 'ok');
      }).catch((error) => {
        reportError(error);
      });
    }

    async function removeAnnotation(annotationId, button) {
      button.disabled = true;
      try {
        const result = await session.removeAnnotation({ mutationId: crypto.randomUUID(), annotationId });
        await awaitSettlement(result, {
          failMessage: 'comment marker was not removed',
          unreconciledMessage: 'comment marker removal was not reconciled',
        });
        setStatus('comment marker deleted', 'ok');
      } catch (error) {
        button.disabled = false;
        reportError(error);
      }
    }

    $('add-comment').onclick = () => void addCommentMarker();
    function updateCommentButton() {
      let selection;
      try {
        selection = editorBinding?.getSelection();
      } catch (error) {
        reportError(error);
        selection = null;
      }
      // getSelection() may be null (no editor) or undefined (no selection yet);
      // only a well-formed range enables the marker buttons.
      const enabled = selection != null
        && selection.from != null && selection.to != null
        && (selection.from.blockId !== selection.to.blockId || selection.from.offset !== selection.to.offset);
      $('add-comment').disabled = session?.status !== 'live' || !enabled;
      $('mark-confidential').disabled = session?.status !== 'live' || !enabled;
    }
    document.addEventListener('selectionchange', updateCommentButton);

    // Confidential marking applies a comment (target) then a protecting
    // confidential span over the same selection. The reader principal sees the
    // redacted placeholder; the owner sees the real text with the highlight.
    function markConfidential() {
      if ($('editor').getAttribute('aria-busy') === 'true') {
        setStatus('wait for the local text change to finish before marking confidential', 'error');
        return;
      }
      const selection = editorBinding?.getSelection();
      if (!selection) {
        setStatus('select text in the document first', 'error');
        return;
      }
      if (selection.from.blockId === selection.to.blockId && selection.from.offset === selection.to.offset) {
        setStatus('select a range of text to mark confidential', 'error');
        return;
      }
      const sensitiveId = crypto.randomUUID();
      const confidentialId = crypto.randomUUID();
      const sensitive = {
        id: sensitiveId,
        family: 'sensitive',
        fields: {},
      };
      const confidential = {
        id: confidentialId,
        family: 'confidential',
        fields: {},
        protectedTargetIds: [sensitiveId],
      };
      Promise.resolve().then(async () => {
        // Apply the protected target (`sensitive`), then the protecting span
        // over the same range. The target is projection-visible so we re-derive
        // its range from the settled document; the protecting span itself is
        // projection-only and never appears in the recipient document. The
        // blockless membership IS the sensitive range: a protecting span over
        // the whole single-block view would restrict the entire document.
        const applied = await session.applyAnnotation({
          mutationId: crypto.randomUUID(),
          annotation: sensitive,
          from: selection.from,
          to: selection.to,
        });
        await awaitSettlement(applied, { failMessage: 'sensitive span was not applied' });
        const sensitiveMembership = (session.document?.memberships ?? [])
          .find((membership) => membership.annotationId === sensitiveId);
        const memberBlock = (session.document?.blocks ?? [])
          .find((block) => block.kind === 'visible' && block.id === sensitiveMembership?.blockId);
        if (!sensitiveMembership || !memberBlock
          || !Number.isSafeInteger(sensitiveMembership.start) || !Number.isSafeInteger(sensitiveMembership.end)) {
          throw new Error('sensitive span did not settle into a visible range');
        }
        const protectedApplied = await session.applyAnnotation({
          mutationId: crypto.randomUUID(),
          annotation: confidential,
          from: { blockId: memberBlock.id, offset: sensitiveMembership.start, affinity: 'right' },
          to: { blockId: memberBlock.id, offset: sensitiveMembership.end, affinity: 'right' },
        });
        await awaitSettlement(protectedApplied, { failMessage: 'confidential span was not applied' });
        setStatus('confidential span marked', 'ok');
      }).catch((error) => {
        reportError(error);
      });
    }

    $('mark-confidential').onclick = () => void markConfidential();

    $('view-as').value = viewAs;
    $('view-as').addEventListener('change', (event) => {
      const next = event.target.value === 'reader' ? 'reader' : 'demo';
      sessionStorage.setItem('annotated-doc-view-as', next);
      location.reload();
    });
    try {
      await loadDocs();
      if (docs[0]) await openDoc(docs[0].id);
    } catch (error) {
      reportError(error);
    }
  </script>
</body>
</html>
