<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>annotated-doc - Workbench floor</title>
  <style>
    :root { color-scheme:light dark; --bg:#f6f7f9; --panel:#fff; --line:#d8dce3; --muted:#667085; --accent:#1d4ed8; --danger:#b91c1c; --ok:#15803d; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:#111; background:var(--bg); font:14px/1.45 system-ui,sans-serif; }
    header { display:flex; gap:12px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
    header h1 { margin:0; font-size:15px; font-weight:650; }
    header .meta { margin-left:auto; color:var(--muted); font-size:12px; }
    main { display:grid; grid-template-columns:240px 1fr; height:calc(100vh - 45px); }
    aside { overflow:auto; padding:12px; border-right:1px solid var(--line); background:var(--panel); }
    button { padding:7px 10px; border:1px solid var(--line); border-radius:7px; background:var(--panel); cursor:pointer; }
    button:disabled { opacity:.5; cursor:default; }
    #create { width:100%; margin-bottom:12px; color:#fff; border-color:var(--accent); background:var(--accent); }
    .doc { margin-bottom:4px; padding:8px 10px; border:1px solid transparent; border-radius:8px; cursor:pointer; }
    .doc:hover { background:#eef2ff; }
    .doc.active { border-color:#c7d2fe; background:#e0e7ff; }
    .doc small { display:block; margin-top:2px; color:var(--muted); font-size:11px; }
    #editor-wrap { display:flex; flex-direction:column; min-width:0; }
    #status { min-height:34px; padding:8px 16px; border-bottom:1px solid var(--line); color:var(--muted); background:var(--panel); font-size:12px; }
    #status.error { color:var(--danger); }
    #status.ok { color:var(--ok); }
    #marker-bar { display:flex; gap:8px; align-items:center; padding:6px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
    #add-comment:disabled { opacity:.5; cursor:default; }
    #document-workspace { display:grid; grid-template-columns:minmax(0,1fr) 260px; flex:1; min-height:0; }
    #editor { overflow:auto; min-height:200px; margin:16px; padding:16px 18px; border:1px solid var(--line); border-radius:10px; outline:none; background:var(--panel); white-space:pre-wrap; font:15px/1.55 ui-sans-serif,system-ui,sans-serif; }
    #editor [data-annotation-families~="comment"] { background:#fef08a; }
    #editor [data-active-annotation="true"] { background:#f59e0b; box-shadow:inset 0 -2px #b45309; }
    #editor:empty::before { color:#98a2b3; content:attr(data-placeholder); }
    #annotations-panel { overflow:auto; margin:16px 16px 16px 0; padding-left:16px; border-left:1px solid var(--line); }
    #annotations-panel h2 { margin:0 0 10px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
    #annotations-empty { margin:0; color:var(--muted); font-size:12px; }
    .annotation-card { margin-bottom:8px; padding:10px; border:1px solid var(--line); border-radius:9px; background:var(--panel); }
    .annotation-card:hover, .annotation-card:focus-within { border-color:#f59e0b; }
    .annotation-card strong { display:block; margin-bottom:3px; }
    .annotation-card p { overflow:hidden; margin:0 0 8px; color:var(--muted); font-size:12px; text-overflow:ellipsis; white-space:nowrap; }
    .annotation-card button { padding:4px 7px; color:var(--danger); font-size:12px; }
    #empty { margin:40px auto; color:var(--muted); text-align:center; }
    .hidden { display:none !important; }
    @media (max-width:700px) { main { grid-template-columns:1fr; grid-template-rows:auto 1fr; } aside { display:flex; gap:8px; overflow:auto; border-right:0; border-bottom:1px solid var(--line); } #create { width:auto; margin:0; } #list { display:flex; gap:4px; } .doc { min-width:140px; } #document-workspace { grid-template-columns:1fr; grid-template-rows:minmax(240px,1fr) auto; overflow:auto; } #editor { min-height:240px; } #annotations-panel { overflow:visible; margin:0 16px 16px; padding:14px 0 0; border-top:1px solid var(--line); border-left:0; } }
  </style>
</head>
<body>
  <header>
    <h1>annotated-doc</h1>
    <span class="meta">Workbench <code>annotatedText()</code> floor - fixed principal <code>demo</code></span>
  </header>
  <main>
    <aside>
      <button id="create">New document</button>
      <div id="list"></div>
    </aside>
    <section id="editor-wrap">
      <div id="status">Select or create a document.</div>
      <div id="marker-bar">
        <button id="add-comment" disabled>Add comment marker</button>
      </div>
      <div id="empty">No document open.</div>
      <div id="document-workspace" class="hidden">
        <div id="editor" spellcheck="true" data-placeholder="Type here" role="textbox" aria-multiline="true"></div>
        <section id="annotations-panel" aria-label="Comments">
          <h2>Comments</h2>
          <p id="annotations-empty">No comments yet.</p>
          <div id="annotations"></div>
        </section>
      </div>
    </section>
  </main>
  <script type="module">
    import { bindAnnotatedTextEditor, createAnnotatedTextHttpSession } from '/workbench.mjs';
    import { DocClient } from '/client-handle.mjs';

    const $ = (id) => document.getElementById(id);
    const historySession = (() => {
      const key = 'annotated-doc-history-session';
      const existing = sessionStorage.getItem(key);
      if (existing) return existing;
      const value = crypto.randomUUID().replaceAll('-', '');
      sessionStorage.setItem(key, value);
      return value;
    })();
    let docs = [];
    let currentId = null;
    let session = null;
    let editorBinding = null;
    let unsubscribe = null;
    let busy = false;

    function setStatus(message, kind = '') {
      $('status').textContent = message;
      $('status').className = kind;
    }

    function reportError(error) {
      const message = error?.message ?? String(error);
      console.error(`[annotated-doc] ${message}`);
      setStatus(message, 'error');
    }

    function shortId(id) { return id.length > 12 ? `${id.slice(0, 8)}...` : id; }

    function renderDocList() {
      $('list').replaceChildren();
      if (!docs.length) {
        const empty = document.createElement('p');
        empty.textContent = 'no documents yet';
        empty.style.cssText = 'color:#98a2b3;margin:8px 4px';
        $('list').append(empty);
        return;
      }
      for (const doc of docs) {
        const item = document.createElement('div');
        item.className = `doc${doc.id === currentId ? ' active' : ''}`;
        const label = document.createElement('strong');
        label.textContent = shortId(doc.id);
        const detail = document.createElement('small');
        detail.textContent = doc.id;
        item.append(label, detail);
        item.onclick = () => void openWhenFree(doc.id);
        $('list').append(item);
      }
    }

    async function loadDocs() {
      const response = await fetch('/docs', { credentials: 'include' });
      if (!response.ok) throw new Error(`list failed (${response.status})`);
      docs = (await response.json()).docs ?? [];
      renderDocList();
    }

    function closeSession() {
      unsubscribe?.();
      editorBinding?.close();
      session?.close();
      unsubscribe = null;
      editorBinding = null;
      session = null;
      renderAnnotations();
    }

    function renderSessionStatus(document = session?.document) {
      const block = document?.blocks?.find((candidate) => candidate.kind === 'visible');
      setStatus(
        document ? `${session.status} - ${block ? `${block.id.slice(0, 8)}...` : 'no visible block'}` : 'document unavailable',
        document && session.status === 'live' ? 'ok' : document ? '' : 'error',
      );
    }

    function setActiveAnnotation(annotationId, active) {
      for (const span of $('editor').querySelectorAll('[data-annotation-ids]')) {
        const ids = span.dataset.annotationIds?.split(' ') ?? [];
        if (ids.includes(annotationId)) {
          if (active) span.dataset.activeAnnotation = 'true';
          else delete span.dataset.activeAnnotation;
        }
      }
    }

    function annotationQuote(document, annotationId) {
      const memberIds = new Set((document.memberships ?? [])
        .filter((membership) => membership.annotationId === annotationId)
        .sort((left, right) => left.ordinal - right.ordinal)
        .map((membership) => membership.blockId));
      const quote = (document.blocks ?? [])
        .filter((block) => block.kind === 'visible' && memberIds.has(block.id))
        .map((block) => block.text)
        .join('');
      return quote.length > 72 ? `${quote.slice(0, 69)}...` : quote;
    }

    function selectAnnotation(annotationId) {
      const spans = [...$('editor').querySelectorAll('[data-annotation-ids]')]
        .filter((span) => span.dataset.annotationIds?.split(' ').includes(annotationId));
      const first = spans[0];
      const last = spans.at(-1);
      if (!first || !last) return;
      const range = document.createRange();
      range.setStart(first.firstChild ?? first, 0);
      if (last.firstChild?.nodeType === Node.TEXT_NODE) range.setEnd(last.firstChild, last.firstChild.data.length);
      else range.setEnd(last, last.childNodes.length);
      editorBinding?.focus();
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
    }

    function renderAnnotations(snapshot = session?.document) {
      const annotations = (snapshot?.annotations ?? []).filter((annotation) => annotation.family === 'comment');
      $('annotations').replaceChildren();
      $('annotations-empty').classList.toggle('hidden', annotations.length > 0);
      for (const [index, annotation] of annotations.entries()) {
        const card = document.createElement('article');
        card.className = 'annotation-card';
        card.dataset.annotationId = annotation.id;
        card.tabIndex = 0;
        card.setAttribute('aria-label', `Locate comment ${index + 1}`);
        const title = document.createElement('strong');
        title.textContent = `Comment ${index + 1}`;
        const quote = document.createElement('p');
        quote.textContent = annotationQuote(snapshot, annotation.id) || 'Attached text is not visible.';
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.textContent = 'Delete';
        remove.setAttribute('aria-label', `Delete comment ${index + 1}`);
        card.addEventListener('mouseenter', () => setActiveAnnotation(annotation.id, true));
        card.addEventListener('mouseleave', () => setActiveAnnotation(annotation.id, false));
        card.addEventListener('focusin', () => setActiveAnnotation(annotation.id, true));
        card.addEventListener('focusout', () => setActiveAnnotation(annotation.id, false));
        card.addEventListener('click', (event) => {
          if (event.target.closest('button')) return;
          selectAnnotation(annotation.id);
        });
        card.addEventListener('keydown', (event) => {
          if (event.key !== 'Enter' && event.key !== ' ') return;
          event.preventDefault();
          selectAnnotation(annotation.id);
        });
        remove.onclick = () => void removeAnnotation(annotation.id, remove);
        card.append(title, quote, remove);
        $('annotations').append(card);
      }
    }

    function renderSession(document = session?.document) {
      renderSessionStatus(document);
      renderAnnotations(document);
    }

    function withTimeout(promise, ms, message) {
      let timer;
      return Promise.race([
        promise,
        new Promise((_, reject) => { timer = setTimeout(() => reject(new Error(message)), ms); }),
      ]).finally(() => clearTimeout(timer));
    }

    function openWhenFree(id) {
      return (async () => {
        while (busy) await new Promise((resolve) => setTimeout(resolve, 50));
        await openDoc(id);
      })();
    }

    async function openDoc(id) {
      if (busy) return;
      busy = true;
      closeSession();
      currentId = id;
      renderDocList();
      $('empty').classList.add('hidden');
      $('document-workspace').classList.remove('hidden');
      setStatus(`opening ${shortId(id)}...`);
      try {
        session = createAnnotatedTextHttpSession({
          baseUrl: '/live-delivery',
          context: { entity: DocClient, field: DocClient.body, documentId: id },
          historySession,
          onRecoveryDelayed: (delayed) => {
            if (delayed) setStatus('sync delayed - still retrying...');
          },
        });
        unsubscribe = session.subscribe(renderSession);
        editorBinding = bindAnnotatedTextEditor({
          element: $('editor'),
          session,
          onError: reportError,
        });
        await withTimeout(session.ready, 10000, 'document is taking too long to open — try again');
        renderSession();
        updateCommentButton();
        editorBinding.focus();
      } catch (error) {
        reportError(error);
        closeSession();
      } finally {
        busy = false;
      }
    }

    async function createDoc() {
      $('create').disabled = true;
      try {
        const response = await fetch('/docs', {
          method: 'POST', credentials: 'include', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ clientId: historySession }),
        });
        const body = await response.json();
        if (!response.ok || !body.ok) throw new Error(body.failure?.message ?? `create failed (${response.status})`);
        await loadDocs();
        await openWhenFree(body.id);
      } catch (error) {
        reportError(error);
      } finally {
        $('create').disabled = false;
      }
    }

    $('create').onclick = () => void createDoc();

    function addCommentMarker() {
      if ($('editor').getAttribute('aria-busy') === 'true') {
        setStatus('wait for the local text change to finish before adding a marker', 'error');
        return;
      }
      const selection = editorBinding?.getSelection();
      if (!selection) {
        setStatus('select text in the document first', 'error');
        return;
      }
      if (selection.from.blockId === selection.to.blockId && selection.from.offset === selection.to.offset) {
        setStatus('select a range of text to comment on', 'error');
        return;
      }
      const annotation = {
        id: crypto.randomUUID(),
        family: 'comment',
        fields: {},
      };
      Promise.resolve().then(() => session.applyAnnotation({
        mutationId: crypto.randomUUID(),
        annotation,
        from: selection.from,
        to: selection.to,
      })).then(async (result) => {
        if (result?.ok === false) throw (result.failure ?? new Error('comment marker was not applied'));
        if (result?.settlement?.wait) {
          const settlement = await result.settlement.wait();
          if (settlement?.status !== 'reconciled') throw new Error('comment marker was not reconciled');
        }
        setStatus('comment marker added', 'ok');
      }).catch((error) => {
        reportError(error);
      });
    }

    async function removeAnnotation(annotationId, button) {
      button.disabled = true;
      try {
        const result = await session.removeAnnotation({ mutationId: crypto.randomUUID(), annotationId });
        if (result?.ok === false) throw (result.failure ?? new Error('comment marker was not removed'));
        if (result?.settlement?.wait) {
          const settlement = await result.settlement.wait();
          if (settlement?.status !== 'reconciled') throw new Error('comment marker removal was not reconciled');
        }
        setStatus('comment marker deleted', 'ok');
      } catch (error) {
        button.disabled = false;
        reportError(error);
      }
    }

    $('add-comment').onclick = () => void addCommentMarker();
    function updateCommentButton() {
      const selection = editorBinding?.getSelection();
      const enabled = selection !== null
        && (selection.from.blockId !== selection.to.blockId || selection.from.offset !== selection.to.offset);
      $('add-comment').disabled = session?.status !== 'live' || !enabled;
    }
    document.addEventListener('selectionchange', updateCommentButton);
    try {
      await loadDocs();
      if (docs[0]) await openDoc(docs[0].id);
    } catch (error) {
      reportError(error);
    }
  </script>
</body>
</html>
