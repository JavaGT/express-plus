# test.javagrant.ac.nz — Workbench annotated-doc floor demo
# Proxies to node projects/annotated-doc/server.mjs on 127.0.0.1:3460.
#
# Install:
#   cp projects/annotated-doc/nginx-test.javagrant.ac.nz.conf \
#      /opt/homebrew/etc/nginx/servers/test.javagrant.ac.nz.conf
#   nginx -t && nginx -s reload
#
# Run the demo (from workbench root):
#   PORT=3460 node projects/annotated-doc/server.mjs

server {
    listen 80;
    listen [::]:80;
    server_name test.javagrant.ac.nz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name test.javagrant.ac.nz;

    ssl_certificate /Users/server/letsencrypt/live/javagrant.ac.nz/fullchain.pem;
    ssl_certificate_key /Users/server/letsencrypt/live/javagrant.ac.nz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3460;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Live-delivery SSE / long poll
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
